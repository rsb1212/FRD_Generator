<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login — FRD Generator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
        .login-card { background: rgba(255,255,255,0.96); border-radius: 20px; padding: 35px; box-shadow: 0 20px 60px rgba(0,0,0,0.25); }
    </style>
</head>
<body>
<!-- Loading Overlay -->
<div id="page-loader" class="loader-overlay">
    <div class="loader-content">
        <div class="loader-spinner">
            <div class="spinner-ring"></div>
            <div class="spinner-ring ring-2"></div>
            <div class="spinner-ring ring-3"></div>
            <div class="loader-icon">🔐</div>
        </div>
        <div class="loader-text">Loading</div>
        <div class="loader-dots">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
        </div>
    </div>
</div>
<style>
    .loader-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        display: flex; align-items: center; justify-content: center;
        transition: opacity 0.6s ease, visibility 0.6s ease;
    }
    .loader-overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .loader-content { text-align: center; }
    .loader-spinner { position: relative; width: 120px; height: 120px; margin: 0 auto 24px; }
    .spinner-ring {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        border: 3px solid transparent; border-top-color: rgba(255,255,255,0.9);
        border-radius: 50%; animation: spin 1.2s linear infinite;
    }
    .ring-2 { width: 85px; height: 85px; top: 17.5px; left: 17.5px; border-top-color: rgba(255,255,255,0.5); animation-duration: 1.8s; animation-direction: reverse; }
    .ring-3 { width: 55px; height: 55px; top: 32.5px; left: 32.5px; border-top-color: rgba(255,255,255,0.3); animation-duration: 2.4s; }
    .loader-icon {
        position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
        font-size: 30px; animation: pulse 1.5s ease-in-out infinite;
    }
    .loader-text { color: #fff; font-size: 18px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 8px; }
    .loader-dots { display: flex; justify-content: center; gap: 6px; }
    .dot {
        width: 8px; height: 8px; background: rgba(255,255,255,0.7); border-radius: 50%;
        animation: bounce 1.4s ease-in-out infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%, 100% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -50%) scale(1.15); } }
    @keyframes bounce { 0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; } 40% { transform: scale(1); opacity: 1; } }
</style>
<script>
    window.addEventListener('load', function() {
        setTimeout(function() {
            document.getElementById('page-loader').classList.add('hidden');
        }, 400);
    });
</script>
<div class="container d-flex align-items-center justify-content-center" style="min-height:100vh;">
    <div class="col-md-5">
        <div class="login-card">
            <h2 class="fw-bold mb-2 text-primary">🔐 Login</h2>
            <p class="text-muted">Access the FRD Generator dashboard.</p>
            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-warning">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}
            <form method="POST" action="{{ url_for('login') }}">
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Sign in</button>
            </form>
            <div class="mt-3 small text-muted">Default credentials: admin / admin123</div>
        </div>
    </div>
</div>
</body>
</html>
